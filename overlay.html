<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <!-- Başlık overlay.js tarafından "Karip Traker · <bileşen>" yapılır; uygulama pencereyi başlığından bulur. -->
  <title>Karip Traker</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/overlay.css">
  <script>
    // Başlığı hemen koy (modül yüklenmeden): uygulama pencereyi bu başlıkla arar.
    (function () {
      var T = { hub: 'Menü', dps: 'Hasar', remind: 'Hatırlatıcı', energy: 'Enerji', bosses: 'Bosslar', gear: 'Gear', todos: 'Yapılacaklar', dungeons: 'Zindanlar', lastbox: 'Son kutu', clock: 'Saat', status: 'Uygulama durumu' };
      var w = new URLSearchParams(location.search).get('w') || 'hub';
      document.title = 'Karip Traker · ' + (T[w] || 'Menü');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="assets/js/overlay.js"></script>
</body>
</html>
