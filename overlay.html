<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <!-- Başlık overlay.js tarafından "Karip Traker · <bileşen>" yapılır; uygulama pencereyi başlığından bulur. -->
  <title>Karip Traker</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/overlay.css">
  <script>
    // Başlığı hemen koy (modül yüklenmeden): uygulama pencereyi bu başlıkla arar.
    (function () {
      var T = { hub: 'Menü', dps: 'Hasar', remind: 'Hatırlatıcı', energy: 'Enerji', bosses: 'Bosslar', gear: 'Gear', todos: 'Yapılacaklar', dungeons: 'Zindanlar', lastbox: 'Son kutu', clock: 'Saat', status: 'Uygulama durumu' };
      var w = new URLSearchParams(location.search).get('w') || 'hub';
      document.title = 'Karip Traker · ' + (T[w] || 'Menü');
      if (w !== 'hub') document.documentElement.classList.add('keyed');   // bileşen: arka plan saydam (uygulama renk anahtarıyla gizler)
    })();
    // Sayfa hata verirse boş pencere yerine hatayı göster; hiç çizilemediyse birkaç kez kendini yenile
    // (ör. güncelleme sırasında yarım kalmış bir dosya yüklendiyse).
    (function () {
      function show(msg) {
        var r = document.getElementById('root');
        if (r && !r.children.length) r.innerHTML = '<p class="ov-err">Sayfa yüklenemedi: ' + String(msg).replace(/[<>&]/g, '') + '</p>';
      }
      window.addEventListener('error', function (e) { show(e.message || e); });
      window.addEventListener('unhandledrejection', function (e) { show(e.reason && e.reason.message || e.reason); });
      setTimeout(function () {
        var r = document.getElementById('root');
        var n = Number(sessionStorage.getItem('kt.reload') || 0);
        if (r && (!r.children.length || r.querySelector('.ov-err')) && n < 3) { sessionStorage.setItem('kt.reload', n + 1); location.reload(); }
        else if (r && r.children.length && !r.querySelector('.ov-err')) sessionStorage.removeItem('kt.reload');
      }, 6000);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="assets/js/overlay.js"></script>
</body>
</html>
